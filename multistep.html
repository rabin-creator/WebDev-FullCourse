<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Multi-Step Form Wizard</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 480px;
      margin: 50px auto;
      padding: 20px;
    }
    .card {
      border: 1px solid #ddd;
      padding: 25px;
      border-radius: 8px;
      background: #fafafa;
    }
    .step-indicator {
      display: flex;
      justify-content: space-between;
      margin-bottom: 25px;
    }
    .step-badge {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #e2e8f0;
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }
    .step-badge.active {
      background: #2563eb;
      color: white;
    }
    .step-content {
      display: none;
    }
    .step-content.active {
      display: block;
    }
    .form-group {
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
    }
    label {
      font-size: 0.9rem;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input, select {
      padding: 8px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .error-msg {
      color: #dc2626;
      font-size: 0.85rem;
      margin-top: 4px;
      display: none;
    }
    .nav-buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 25px;
    }
    button {
      padding: 10px 18px;
      font-size: 0.95rem;
      cursor: pointer;
      border: none;
      border-radius: 5px;
    }
    .btn-prev { background: #94a3b8; color: white; }
    .btn-next { background: #2563eb; color: white; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="step-indicator">
      <div class="step-badge active" id="badge-1">1</div>
      <div class="step-badge" id="badge-2">2</div>
      <div class="step-badge" id="badge-3">3</div>
    </div>

    <!-- Step 1: Personal Info -->
    <div class="step-content active" id="step-1">
      <h3>Step 1: Personal Info</h3>
      <div class="form-group">
        <label for="full-name">Full Name</label>
        <input type="text" id="full-name" placeholder="John Doe">
        <span class="error-msg" id="name-error">Please enter your name</span>
      </div>
    </div>

    <!-- Step 2: Account Details -->
    <div class="step-content" id="step-2">
      <h3>Step 2: Account Details</h3>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="john@example.com">
        <span class="error-msg" id="email-error">Please enter a valid email</span>
      </div>
    </div>

    <!-- Step 3: Review & Submit -->
    <div class="step-content" id="step-3">
      <h3>Step 3: Review</h3>
      <p><strong>Name:</strong> <span id="review-name"></span></p>
      <p><strong>Email:</strong> <span id="review-email"></span></p>
    </div>

    <div class="nav-buttons">
      <button id="prev-btn" class="btn-prev hidden">Previous</button>
      <button id="next-btn" class="btn-next">Next</button>
    </div>
  </div>

  <script src="multistep.js"></script>
</body>
</html>
