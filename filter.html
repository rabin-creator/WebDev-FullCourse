<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Filterable Item Gallery</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 500px;
      margin: 50px auto;
      text-align: center;
    }
    .filter-buttons {
      margin-bottom: 20px;
    }
    .btn {
      padding: 8px 16px;
      margin: 0 4px;
      border: 1px solid #2563eb;
      background: white;
      color: #2563eb;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn.active {
      background: #2563eb;
      color: white;
    }
    .gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    .card {
      width: 140px;
      padding: 20px 10px;
      border-radius: 6px;
      color: white;
      font-weight: bold;
      transition: transform 0.2s, opacity 0.2s;
    }
    .card.hidden {
      display: none;
    }
    /* Simple category colors */
    .fruit { background: #ef4444; }
    .veggie { background: #22c55e; }
  </style>
</head>
<body>
  <h2>Item Filter</h2>

  <div class="filter-buttons">
    <button class="btn active" data-filter="all">All</button>
    <button class="btn" data-filter="fruit">Fruits</button>
    <button class="btn" data-filter="veggie">Veggies</button>
  </div>

  <div class="gallery">
    <div class="card fruit" data-category="fruit">Apple 🍎</div>
    <div class="card veggie" data-category="veggie">Carrot 🥕</div>
    <div class="card fruit" data-category="fruit">Banana 🍌</div>
    <div class="card veggie" data-category="veggie">Broccoli 🥦</div>
    <div class="card fruit" data-category="fruit">Strawberry 🍓</div>
  </div>

  <script src="filter.js"></script>
</body>
</html>
