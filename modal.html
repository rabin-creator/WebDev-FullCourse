<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Modal Window</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin-top: 100px;
    }
    .open-btn {
      padding: 12px 24px;
      font-size: 1rem;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    /* Overlay Background */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    /* Show Modal State */
    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }
    /* Modal Card */
    .modal-card {
      background: white;
      padding: 30px;
      border-radius: 8px;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      position: relative;
    }
    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 1.5rem;
      border: none;
      background: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>Interactive Modal Example</h2>
  <button id="open-btn" class="open-btn">Open Modal</button>

  <div id="modal-overlay" class="modal-overlay">
    <div class="modal-card">
      <button id="close-btn" class="close-btn">&times;</button>
      <h3>Modal Title</h3>
      <p>This is a lightweight DOM modal. You can close it by clicking the X button, clicking outside the box, or pressing the Escape key.</p>
    </div>
  </div>

  <script src="modal.js"></script>
</body>
</html>
