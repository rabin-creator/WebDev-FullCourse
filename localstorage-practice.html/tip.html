<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tip Calculator</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 400px;
      margin: 50px auto;
      padding: 20px;
    }
    .card {
      border: 1px solid #ddd;
      padding: 20px;
      border-radius: 8px;
      background: #f9f9f9;
    }
    .form-group {
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
    }
    label {
      font-size: 0.9rem;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input {
      padding: 8px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .results {
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid #ddd;
    }
    .result-row {
      display: flex;
      justify-content: space-between;
      margin: 8px 0;
      font-size: 1.1rem;
    }
    .total-amount {
      color: #2563eb;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Tip Calculator</h2>

    <div class="form-group">
      <label for="bill">Bill Amount ($):</label>
      <input type="number" id="bill" min="0" step="0.01" placeholder="100.00">
    </div>

    <div class="form-group">
      <label for="tip">Tip Percentage (%):</label>
      <input type="number" id="tip" min="0" value="15">
    </div>

    <div class="form-group">
      <label for="people">Number of People:</label>
      <input type="number" id="people" min="1" value="1">
    </div>

    <div class="results">
      <div class="result-row">
        <span>Tip Total:</span>
        <span id="tip-amount">$0.00</span>
      </div>
      <div class="result-row">
        <span>Total Amount:</span>
        <span id="total-amount">$0.00</span>
      </div>
      <div class="result-row">
        <span>Per Person:</span>
        <span id="per-person" class="total-amount">$0.00</span>
      </div>
    </div>
  </div>

  <script src="tip.js"></script>
</body>
</html>
