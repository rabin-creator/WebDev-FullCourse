<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Password Generator</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 400px;
      margin: 50px auto;
      padding: 20px;
    }
    .card {
      border: 1px solid #ddd;
      padding: 20px;
      border-radius: 8px;
      background: #fafafa;
    }
    .output-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px;
      font-size: 1.1rem;
      font-family: monospace;
    }
    button {
      padding: 10px 15px;
      cursor: pointer;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 5px;
    }
    .setting {
      display: flex;
      justify-content: space-between;
      margin: 12px 0;
    }
    .generate-btn {
      width: 100%;
      margin-top: 15px;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Password Generator</h2>

    <div class="output-box">
      <input type="text" id="password-display" readonly placeholder="Click Generate">
      <button id="copy-btn">Copy</button>
    </div>

    <div class="setting">
      <label for="length">Password Length:</label>
      <input type="number" id="length" min="4" max="32" value="12">
    </div>

    <div class="setting">
      <label for="include-numbers">Include Numbers:</label>
      <input type="checkbox" id="include-numbers" checked>
    </div>

    <div class="setting">
      <label for="include-symbols">Include Symbols:</label>
      <input type="checkbox" id="include-symbols" checked>
    </div>

    <button id="generate-btn" class="generate-btn">Generate Password</button>
  </div>

  <script src="password.js"></script>
</body>
</html>
