<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Counter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #121212;
      color: #ffffff;
      margin-top: 100px;
    }
    .counter-container {
      display: inline-block;
      padding: 40px;
      border-radius: 12px;
      background-color: #1e1e1e;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
    #counter-value {
      font-size: 4rem;
      margin: 20px 0;
      font-weight: bold;
      transition: color 0.2s ease;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    button {
      padding: 12px 24px;
      font-size: 18px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    #decrease-btn { background-color: #e63946; color: white; }
    #reset-btn { background-color: #6c757d; color: white; }
    #increase-btn { background-color: #2a9d8f; color: white; }
  </style>
</head>
<body>

  <div class="counter-container">
    <h1>Interactive Counter</h1>
    <div id="counter-value">0</div>
    
    <div class="btn-group">
      <button id="decrease-btn">Decrease</button>
      <button id="reset-btn">Reset</button>
      <button id="increase-btn">Increase</button>
    </div>
  </div>

  <script src="counter-script.js"></script>
</body>
</html>
