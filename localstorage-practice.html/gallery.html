<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Gallery & Lightbox</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 40px 20px;
    }
    h1 {
      margin-bottom: 5px;
    }
    p {
      color: #aaa;
    }
    .gallery {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-top: 30px;
    }
    .gallery img {
      width: 220px;
      height: 150px;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }
    .gallery img:hover {
      transform: scale(1.05);
      opacity: 0.85;
    }
    /* Modal / Lightbox Overlay */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal.active {
      display: flex;
    }
    .modal img {
      max-width: 80%;
      max-height: 80%;
      border-radius: 10px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.5);
    }
    .close-btn {
      position: absolute;
      top: 25px;
      right: 35px;
      font-size: 35px;
      color: white;
      cursor: pointer;
      user-select: none;
    }
    .close-btn:hover {
      color: #ff4d4d;
    }
  </style>
</head>
<body>

  <h1>Photo Gallery</h1>
  <p>Click any thumbnail to open the modal preview</p>

  <div class="gallery">
    <img src="https://picsum.photos/id/10/600/400" alt="Mountain Landscape">
    <img src="https://picsum.photos/id/20/600/400" alt="Work Desk">
    <img src="https://picsum.photos/id/28/600/400" alt="Forest Trail">
  </div>

  <!-- Modal Lightbox Overlay -->
  <div class="modal" id="image-modal">
    <span class="close-btn" id="close-btn">&times;</span>
    <img id="modal-img" src="" alt="Full Preview">
  </div>

  <script src="gallery-script.js"></script>
</body>
</html>
