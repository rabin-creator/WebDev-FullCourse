<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #121212;
      color: #ffffff;
      margin-top: 60px;
    }
    .calculator {
      display: inline-block;
      padding: 20px;
      border-radius: 12px;
      background-color: #1e1e1e;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      width: 280px;
    }
    #display {
      width: 100%;
      height: 50px;
      background-color: #2a2a2a;
      border: none;
      border-radius: 6px;
      color: #ffffff;
      font-size: 1.8rem;
      text-align: right;
      padding: 5px 10px;
      box-sizing: border-box;
      margin-bottom: 15px;
      outline: none;
    }
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    button {
      padding: 15px;
      font-size: 18px;
      border: none;
      border-radius: 6px;
      background-color: #333;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { background-color: #444; }
    button.operator { background-color: #ff9500; }
    button.operator:hover { background-color: #e08400; }
    button.clear { background-color: #e63946; }
    button.clear:hover { background-color: #c92a37; }
    button.equal { background-color: #2a9d8f; grid-column: span 2; }
    button.equal:hover { background-color: #218276; }
  </style>
</head>
<body>

  <div class="calculator">
    <input type="text" id="display" readonly value="">
    <div class="buttons">
      <button class="clear" id="btn-clear">C</button>
      <button class="operator" id="btn-back">⌫</button>
      <button class="operator" id="btn-div">/</button>
      <button class="operator" id="btn-mul">*</button>

      <button class="num">7</button>
      <button class="num">8</button>
      <button class="num">9</button>
      <button class="operator" id="btn-sub">-</button>

      <button class="num">4</button>
      <button class="num">5</button>
      <button class="num">6</button>
      <button class="operator" id="btn-add">+</button>

      <button class="num">1</button>
      <button class="num">2</button>
      <button class="num">3</button>
      <button class="num">.</button>

      <button class="num">0</button>
      <button class="equal" id="btn-equal">=</button>
    </div>
  </div>

  <script src="calculator-script.js"></script>
</body>
</html>
