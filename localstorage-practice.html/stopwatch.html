<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stopwatch & Lap Timer</title>
  <style>
    body {
      font-family: monospace;
      text-align: center;
      margin-top: 50px;
      background: #0f172a;
      color: #f8fafc;
    }
    .card {
      display: inline-block;
      padding: 30px;
      background: #1e293b;
      border-radius: 12px;
      width: 320px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    #display {
      font-size: 3rem;
      margin: 20px 0;
      color: #38bdf8;
    }
    .controls button {
      font-family: sans-serif;
      font-size: 0.9rem;
      padding: 8px 14px;
      margin: 4px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      font-weight: bold;
    }
    #start-btn { background: #22c55e; color: white; }
    #pause-btn { background: #eab308; color: white; }
    #reset-btn { background: #ef4444; color: white; }
    #lap-btn { background: #3b82f6; color: white; }
    
    ul#laps {
      list-style: none;
      padding: 0;
      max-height: 150px;
      overflow-y: auto;
      margin-top: 20px;
      text-align: left;
      font-size: 0.9rem;
      border-top: 1px solid #334155;
    }
    ul#laps li {
      padding: 6px 10px;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Stopwatch</h2>
    <div id="display">00:00:00</div>

    <div class="controls">
      <button id="start-btn">Start</button>
      <button id="pause-btn">Pause</button>
      <button id="lap-btn">Lap</button>
      <button id="reset-btn">Reset</button>
    </div>

    <ul id="laps"></ul>
  </div>

  <script src="stopwatch.js"></script>
</body>
</html>
