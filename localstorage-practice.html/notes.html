<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quick Notes Scratchpad</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 450px;
      margin: 50px auto;
      padding: 20px;
    }
    .card {
      border: 1px solid #ddd;
      padding: 20px;
      border-radius: 8px;
      background: #fafafa;
    }
    textarea {
      width: 100%;
      height: 80px;
      padding: 10px;
      box-sizing: border-box;
      font-size: 1rem;
      margin-bottom: 10px;
    }
    button {
      padding: 10px 15px;
      cursor: pointer;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 5px;
      width: 100%;
      font-size: 1rem;
    }
    ul {
      list-style: none;
      padding: 0;
      margin-top: 20px;
    }
    li {
      background: white;
      border: 1px solid #ccc;
      padding: 10px;
      margin-bottom: 8px;
      border-radius: 5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .delete-btn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      width: auto;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Quick Notes Scratchpad</h2>
    <textarea id="note-input" placeholder="Write a note..."></textarea>
    <button id="add-btn">Add Note</button>

    <ul id="notes-list"></ul>
  </div>

  <script src="notes.js"></script>
</body>
</html>
