<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DOM Task Manager</title>
  <style>
    body { font-family: sans-serif; max-width: 400px; margin: 40px auto; }
    .completed { text-decoration: line-through; opacity: 0.6; }
    li { display: flex; justify-content: space-between; margin: 8px 0; }
  </style>
</head>
<body>
  <h2>Task Tracker</h2>
  <form id="task-form">
    <input type="text" id="task-input" placeholder="Enter new task..." required>
    <button type="submit">Add</button>
  </form>

  <ul id="task-list"></ul>

  <script src="app.js"></script>
</body>
</html>
