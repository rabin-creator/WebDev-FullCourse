<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Random Color Flipper</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin-top: 100px;
      transition: background-color 0.4s ease;
    }
    .card {
      background: rgba(255, 255, 255, 0.9);
      display: inline-block;
      padding: 30px 50px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    h2 { margin-bottom: 10px; }
    #color-text { font-weight: bold; color: #2563eb; }
    button {
      font-size: 1rem;
      padding: 10px 20px;
      margin-top: 15px;
      cursor: pointer;
      border: 1px solid #333;
      border-radius: 5px;
      background: #ffffff;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Background: <span id="color-text">#FFFFFF</span></h2>
    <button id="flip-btn">Flip Color</button>
  </div>

  <script src="color-flipper.js"></script>
</body>
</html>
