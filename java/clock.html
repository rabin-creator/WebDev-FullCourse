<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Live Clock</title>
  <style>
    body {
      font-family: monospace;
      text-align: center;
      margin-top: 80px;
      background: #1e1e2e;
      color: #cdd6f4;
    }
    .clock-card {
      display: inline-block;
      padding: 30px 40px;
      background: #313244;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }
    #clock {
      font-size: 3.5rem;
      font-weight: bold;
      color: #89b4fa;
      letter-spacing: 2px;
    }
    #date {
      font-size: 1.1rem;
      margin-top: 10px;
      color: #a6adc8;
    }
  </style>
</head>
<body>
  <div class="clock-card">
    <div id="clock">00:00:00 AM</div>
    <div id="date">Loading date...</div>
  </div>

  <script src="clock.js"></script>
</body>
</html>
