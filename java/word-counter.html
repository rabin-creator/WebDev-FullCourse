<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Word & Letter Counter</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 450px;
      margin: 50px auto;
    }
    textarea {
      width: 100%;
      height: 120px;
      padding: 10px;
      box-sizing: border-box;
      font-size: 1rem;
    }
    .stats {
      display: flex;
      justify-content: space-around;
      margin-top: 15px;
      background: #f4f4f4;
      padding: 15px;
      border-radius: 6px;
    }
    .stat-box {
      text-align: center;
    }
    .stat-number {
      font-size: 1.5rem;
      font-weight: bold;
      color: #2563eb;
    }
  </style>
</head>
<body>
  <h2>Word & Letter Counter</h2>

  <textarea id="text-input" placeholder="Type or paste your text here..."></textarea>

  <div class="stats">
    <div class="stat-box">
      <div id="word-count" class="stat-number">0</div>
      <div>Words</div>
    </div>
    <div class="stat-box">
      <div id="letter-count" class="stat-number">0</div>
      <div>Letters</div>
    </div>
  </div>

  <script src="word-counter.js"></script>
</body>
</html>
