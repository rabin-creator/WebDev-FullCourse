<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DOM Task Manager with Filters</title>
  <style>
    body { font-family: sans-serif; max-width: 450px; margin: 40px auto; }
    .completed { text-decoration: line-through; opacity: 0.6; }
    li { display: flex; justify-content: space-between; margin: 8px 0; }
    .controls { display: flex; gap: 8px; margin: 15px 0; }
  </style>
</head>
<body>
  <h2>Task Tracker</h2>
  
  <form id="task-form">
    <input type="text" id="task-input" placeholder="Enter new task..." required>
    <button type="submit">Add Task</button>
  </form>

  <div class="controls">
    <input type="text" id="search-input" placeholder="Search tasks...">
    <button id="filter-all">All</button>
    <button id="filter-active">Active</button>
    <button id="filter-completed">Completed</button>
  </div>

  <ul id="task-list"></ul>

  <script src="app.js"></script>
</body>
</html>
