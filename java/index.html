<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM Task Manager</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 50px;
      background-color: #121212;
      color: #ffffff;
    }
    .input-container {
      margin-bottom: 20px;
    }
    input {
      padding: 10px;
      font-size: 16px;
      border-radius: 4px;
      border: 1px solid #444;
      outline: none;
    }
    button {
      padding: 10px 15px;
      font-size: 16px;
      border: none;
      border-radius: 4px;
      background-color: #007acc;
      color: white;
      cursor: pointer;
    }
    ul {
      list-style-type: none;
      padding: 0;
      width: 300px;
    }
    li {
      background-color: #1e1e1e;
      padding: 10px 15px;
      margin-bottom: 8px;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    li:hover {
      background-color: #2a2a2a;
    }
  </style>
</head>
<body>

  <h1>Task Manager</h1>

  <div class="input-container">
    <input type="text" id="task-input" placeholder="Enter a new task...">
    <button id="add-btn">Add Task</button>
  </div>

  <ul id="task-list"></ul>

  <script src="script.js"></script>
</body>
</html>
