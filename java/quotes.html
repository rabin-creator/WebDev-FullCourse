<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Async Quote Generator</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 50px auto; text-align: center; }
    .card { padding: 20px; border: 1px solid #ccc; border-radius: 8px; background: #f9f9f9; }
    .author { font-style: italic; color: #555; margin-top: 10px; }
    button { padding: 10px 20px; cursor: pointer; margin-top: 15px; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <h2>Random Quote Generator</h2>
  <div class="card">
    <p id="quote-text">Loading quote...</p>
    <div id="quote-author" class="author"></div>
  </div>
  <button id="new-quote-btn">Get New Quote</button>

  <script src="quotes.js"></script>
</body>
</html>
