<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hide Show Toggle</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin-top: 50px;
    }
    .hidden {
      display: none;
    }
    p {
      font-size: 1.2rem;
      color: #333;
      margin-top: 20px;
    }
    button {
      font-size: 1rem;
      padding: 8px 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>Paragraph Visibility Toggle</h2>
  
  <button id="toggle-btn">Hide Text</button>
  <p id="secret-text">Peekaboo! Now you see me, now you don't.</p>

  <script src="toggle.js"></script>
</body>
</html>
