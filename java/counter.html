<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Counter</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin-top: 50px;
    }
    #count {
      font-size: 4rem;
      margin: 20px 0;
    }
    button {
      font-size: 1.2rem;
      padding: 8px 16px;
      margin: 0 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>Counter App</h2>
  <div id="count">0</div>

  <button id="decrement-btn">- Decrease</button>
  <button id="reset-btn">Reset</button>
  <button id="increment-btn">+ Increase</button>

  <script src="counter.js"></script>
</body>
</html>
